name: Build and test Taskbar Hero

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate source
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Check main-process JavaScript syntax
        run: npm run check
      - name: Check renderer module syntax
        run: |
          node --check --input-type=module < src/game.js
          node --check --input-type=module < src/inventory.js
      - name: Verify required application files
        run: |
          test -f main.js
          test -f preload.js
          test -f preload-inventory.js
          test -f src/index.html
          test -f src/inventory.html
          test -f src/game.js
          test -f src/config/heroClasses.js
          test -f src/state/GameState.js
          test -f src/platform/browserBridge.js
          test -f android/app/src/main/AndroidManifest.xml
          test -f android/app/src/main/java/io/arkansasio/taskbarhero/MainActivity.java
          test -f scripts/stage-android-assets.mjs
          test -f docs/ANDROID_BUILD.md
          test -f README.md
          test -f docs/RPG_EXPANSION_DESIGN.md
          test -f docs/RPG_TEST_MATRIX.md

  windows-installer:
    name: Package Windows installer
    runs-on: windows-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Build NSIS installer
        run: npm run dist
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: taskbar-hero-windows-installer
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 14
