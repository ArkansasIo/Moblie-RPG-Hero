name: Build Mo RPG Hero APK

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'android/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/android.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'android/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Compile Mo RPG Hero APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install JavaScript dependencies
        run: npm install
      - name: Validate RPG JavaScript source
        run: npm run check:rpg
      - name: Stage web game into Android assets
        run: npm run android:assets
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Compile debug APK
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug
      - name: Compile release APK
        working-directory: android
        run: gradle --no-daemon :app:assembleRelease
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mo-rpg-hero-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: mo-rpg-hero-android-release-unsigned
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 30
