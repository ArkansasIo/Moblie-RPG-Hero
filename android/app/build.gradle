plugins {
    id 'com.android.application'
}

def buildVersionCode = project.hasProperty('buildVersionCode') ? project.property('buildVersionCode').toString().toInteger() : 4
def buildVersionName = project.hasProperty('buildVersionName') ? project.property('buildVersionName').toString() : '0.3.1'

android {
    namespace 'io.arkansasio.taskbarhero'
    compileSdk 35

    defaultConfig {
        applicationId 'io.arkansasio.taskbarhero'
        minSdk 23
        targetSdk 35
        versionCode buildVersionCode
        versionName buildVersionName
    }

    signingConfigs {
        // This project distributes CI/test builds directly to devices. The release
        // variant must be signed; otherwise Android rejects the APK as unsigned.
        // Use the Android debug keystore for the CI test/release artifact.
        ciTest {
            initWith signingConfigs.debug
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.ciTest
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    packaging {
        resources { excludes += ['/META-INF/{AL2.0,LGPL2.1}'] }
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
