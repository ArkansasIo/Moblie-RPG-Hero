plugins {
    id 'com.android.application'
}

def buildVersionCode = project.hasProperty('buildVersionCode') ? project.property('buildVersionCode').toString().toInteger() : 4
def buildVersionName = project.hasProperty('buildVersionName') ? project.property('buildVersionName').toString() : '0.3.1'

android {
    namespace 'io.arkansasio.taskbarhero'
    compileSdk 35

    defaultConfig {
        applicationId 'io.arkansasio.taskbarhero'
        minSdk 23
        targetSdk 35
        versionCode buildVersionCode
        versionName buildVersionName
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    packaging {
        resources { excludes += ['/META-INF/{AL2.0,LGPL2.1}'] }
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
