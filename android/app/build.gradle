plugins {
    id 'com.android.application'
}

android {
    namespace 'io.arkansasio.taskbarhero'
    compileSdk 35

    defaultConfig {
        applicationId 'io.arkansasio.taskbarhero'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    packaging {
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}']
        }
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
