plugins {
    id 'com.android.application'
}

def buildVersionCode = project.hasProperty('buildVersionCode') ? project.property('buildVersionCode').toString().toInteger() : 4
def buildVersionName = project.hasProperty('buildVersionName') ? project.property('buildVersionName').toString() : '0.3.1'
def ciPackageSuffix = project.hasProperty('ciPackageSuffix') ? project.property('ciPackageSuffix').toString() : ''
def ciTestSigning = project.hasProperty('ciTestSigning') && project.property('ciTestSigning').toString().toBoolean()

def baseApplicationId = 'io.arkansasio.taskbarhero'
def resolvedApplicationId = ciPackageSuffix ? "${baseApplicationId}.${ciPackageSuffix}" : baseApplicationId

android {
    namespace baseApplicationId
    compileSdk 35

    defaultConfig {
        applicationId resolvedApplicationId
        minSdk 23
        targetSdk 35
        versionCode buildVersionCode
        versionName buildVersionName
    }

    signingConfigs {
        // CI/test builds use the runner's debug certificate only when explicitly
        // requested. Production releases must use a persistent release keystore.
        ciTest {
            initWith signingConfigs.debug
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            if (ciTestSigning) {
                signingConfig signingConfigs.ciTest
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    packaging {
        resources { excludes += ['/META-INF/{AL2.0,LGPL2.1}'] }
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
