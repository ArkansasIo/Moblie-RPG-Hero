<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <meta name="theme-color" content="#07101c" />
  <title>Mobile RPG Hero — MMORPG Adventure</title>
  <link rel="stylesheet" href="style.css" />
  <script src="platform/browserBridge.js"></script>
  <script type="importmap">
    {"imports":{"pixi.js":"../node_modules/pixi.js/dist/pixi.mjs"}}
  </script>
</head>
<body>
  <div id="game-root"></div>
  <button id="fantasy-codex-button" class="rpg-command-button" type="button" aria-label="Open fantasy asset codex">CODEX</button>
  <button id="mobile-update-button" class="rpg-command-button mobile-update-button" type="button" aria-label="Check for updates">UPDATE</button>
  <section id="fantasy-codex" class="fantasy-codex" hidden aria-label="Fantasy asset codex">
    <div class="fantasy-codex__bar"><strong>Fantasy Codex</strong><button id="fantasy-codex-close" type="button" aria-label="Close fantasy codex">×</button></div>
    <img src="assets/generated/dnd5e-inspired-atlas.svg" alt="Fantasy RPG asset atlas" />
  </section>
  <script type="module" src="launcher.js"></script>
  <script type="module" src="game.js"></script>
  <script type="module" src="rpg/boot.js"></script>
  <script>
    (() => {
      const button = document.getElementById('fantasy-codex-button');
      const panel = document.getElementById('fantasy-codex');
      const close = document.getElementById('fantasy-codex-close');
      const update = document.getElementById('mobile-update-button');
      const toggle = (open) => { panel.hidden = !open; };
      button?.addEventListener('click', () => toggle(panel.hidden));
      close?.addEventListener('click', () => toggle(false));
      update?.addEventListener('click', () => window.taskbarHeroUpdater?.check?.());
    })();
  </script>
</body>
</html>
